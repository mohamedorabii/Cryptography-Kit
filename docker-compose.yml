services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - crypto

  webserver:
    image: nginx:alpine
    container_name: crypto_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crypto

  db:
    image: mysql:8.0
    container_name: crypto_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crypto
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: crypto
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - crypto

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: crypto_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - crypto

networks:
  crypto:
    driver: bridge

volumes:
  dbdata:
    driver: local